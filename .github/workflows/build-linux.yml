name: Build (Linux)

# Builds ruyijs for Linux x86_64 in Debian 12 from the official Firefox
# release in the firefox/ submodule: SpiderMonkey, Skia and NSS/NSPR come from
# that source tree, libnecko_core/libnecko_quic from native/necko_posix against
# that NSS. Every `run:` is one ci/linux/build.sh step; that script lists what
# each step builds and needs. Debian 12 has glibc 2.36; the same wheel is tested
# in Debian 12 and Ubuntu 26.04. Called by wheels.yml; can also run on its own.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ruyijs-linux:
    name: ruyijs (Linux x86_64)
    runs-on: ubuntu-24.04
    container: python:3.14-bookworm
    timeout-minutes: 300
    env:
      CC: clang-21
      CXX: clang++-21
      RUYIJS_LINUX_GLIBC_BASELINE: "2.36"
    steps:
      - name: Debian build prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git gnupg lsb-release software-properties-common sudo python3 python3-venv
          . /etc/os-release
          test "$VERSION_ID" = 12
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"
          python3 --version
          /usr/bin/python3 --version

      - name: Runner facts
        run: |
          echo "CPUs: $(nproc)  RAM: $(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) / 1048576 )) GB"
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Trust the checked-out repositories in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/firefox"

      - name: Fetch Firefox (the submodule commit only)
        id: firefox
        run: |
          sha=$(git ls-tree HEAD firefox | awk '{print $3}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git init -q firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox.git
          for attempt in 1 2 3; do
            git -C firefox fetch --depth 1 --no-tags origin "$sha" && break
            sleep 30
          done
          git -C firefox -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          git -C firefox log -1 --format='%H %cI'

      # Build Python and the helper on the same glibc floor as every native
      # library. A Python from the Ubuntu runner can require a newer glibc.
      - uses: dtolnay/rust-toolchain@stable

      - name: Restore cbindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.4-linux-bookworm-glibc236

      - name: Toolchain and libraries
        id: toolchain
        run: |
          ci/linux/build.sh deps
          # NSS's build.sh runs plain `clang`; this also puts LLVM 21's tools first.
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"
          {
            rustc -vV
            clang-21 --version
          } | sha256sum | awk '{print "hash=" substr($1,1,16)}' >> "$GITHUB_OUTPUT"

      - name: ABI gate regression tests
        run: |
          python3 -B -m unittest discover -s tests -p test_linux_wheel_abi.py -v
          python3 -B -m unittest discover -s tests -p test_cargo_artifacts.py -v

      # Besides the Firefox commit, the objdir depends only on the donor step of
      # build.sh (its configure options), so changes to the other steps keep it.
      - name: SpiderMonkey configuration
        id: donor-config
        run: echo "hash=$(sed -n '/^  donor)$/,/;;$/p' ci/linux/build.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # Saved as soon as it is built, so a later failing step does not lose it.
      # A restored objdir is used as is: make after a fresh checkout would
      # rebuild everything, every source being newer than its object.
      - name: Restore SpiderMonkey build
        id: donor
        uses: actions/cache/restore@v4
        with:
          path: obj/js-linux
          key: firefox-js-linux-bookworm-glibc236-${{ steps.toolchain.outputs.hash }}-${{ steps.firefox.outputs.sha }}-${{ steps.donor-config.outputs.hash }}

      - name: Build SpiderMonkey
        if: steps.donor.outputs.cache-hit != 'true'
        run: ci/linux/build.sh donor

      - name: Save SpiderMonkey build
        if: steps.donor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: obj/js-linux
          key: ${{ steps.donor.outputs.cache-primary-key }}

      - name: Restore native runtime
        id: shell
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/js
            dist/libruyijs_client.so
          key: native-shell-linux-bookworm-glibc236-${{ steps.toolchain.outputs.hash }}-${{ steps.firefox.outputs.sha }}-${{ hashFiles('src/**', 'tools/**', 'profiles/**', 'vendor/*-native/**', 'CMakeLists.txt', 'pyproject.toml', 'ci/linux/build_harfbuzz.sh') }}

      - name: Build dist/js and libruyijs_client.so
        if: steps.shell.outputs.cache-hit != 'true'
        run: ci/linux/build.sh shell

      - name: Save native runtime
        if: steps.shell.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist/js
            dist/libruyijs_client.so
          key: ${{ steps.shell.outputs.cache-primary-key }}

      - name: Restore NSS and Neqo builds
        id: necko
        uses: actions/cache/restore@v4
        with:
          path: |
            build/necko
            build/necko-quic
          key: necko-linux-bookworm-glibc236-${{ steps.toolchain.outputs.hash }}-${{ steps.firefox.outputs.sha }}-${{ hashFiles('runtime.json', 'tools/build_necko_linux.py', 'tools/build_neqo_linux.py', 'native/necko_posix/**') }}

      - name: Build the Necko helper
        run: ci/linux/build.sh necko

      - name: Save NSS and Neqo builds
        if: steps.necko.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/necko
            build/necko-quic
          key: ${{ steps.necko.outputs.cache-primary-key }}

      - name: Build the wheel
        run: ci/linux/build.sh wheel

      - name: Verify every bundled ELF and the wheel tag
        run: python3 -B ci/linux/check_wheel_abi.py wheelhouse/*.whl --glibc "$RUYIJS_LINUX_GLIBC_BASELINE"

      - name: Disk after build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh firefox obj/* build/* vendor/necko-derived 2>/dev/null || true

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: ruyijs-linux
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Test the installed wheel
        run: ci/linux/build.sh test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruyijs-linux-logs
          path: |
            obj/js-linux/config.log
            build/linux/CMakeFiles/CMakeConfigureLog.yaml
            build/linux/.ninja_log
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    name: Install wheel (${{ matrix.image }})
    needs: ruyijs-linux
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12-slim", "ubuntu:26.04"]
    steps:
      - name: Distribution Python and fonts
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 python3-venv fontconfig fonts-dejavu-core fonts-liberation
          getconf GNU_LIBC_VERSION
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ruyijs-linux
          path: wheelhouse
      - name: Install the same wheel on the distribution Python
        run: |
          python3 -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install --no-index wheelhouse/*.whl
      - name: Installed runtime and bundled helper checks
        working-directory: /tmp
        run: |
          unset PYTHONPATH RUYIJS_SHELL LD_LIBRARY_PATH
          for check in smoke_test helper_check layout_check layout_fingerprint_check \
            timer_scale_check socks_proxy_check fetch_abort_check fetch_abort_transfer_check \
            load_timer_check engine_check selection_check cascade_collection_check \
            node_getter_check timer_scaling_check dom_id_index_check dom_tag_ns_check \
            dom_id_fastpath_check worker_blob_message_check computed_style_check \
            hit_test_and_live_range_check flex_nesting_check net_log_check http_timeout_check; do
            /tmp/wheel-test/bin/python "$GITHUB_WORKSPACE/ci/$check.py"
          done
