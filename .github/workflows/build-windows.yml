name: Build (Windows)

# One Windows VM owns the cached Firefox dependencies, native build and wheel
# tests. Donor caches are saved immediately, even if a later project step fails.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOZILLABUILD_VERSION: "4.2.1"
  MOZBUILD_STATE_PATH: C:\mozbuild


defaults:
  run:
    shell: pwsh

jobs:
  ruyijs-windows:
    name: ruyijs (Windows)
    runs-on: windows-2025
    timeout-minutes: 360
    env:
      MOZILLABUILD: C:\mozilla-build\
      MSYS2_PATH_TYPE: inherit
      CHERE_INVOKING: "1"
    steps:
      - name: Prepare runner
        run: |
          Write-Host "CPUs: $env:NUMBER_OF_PROCESSORS"
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch Firefox (the submodule commit only)
        id: firefox
        run: |
          $sha = ((git ls-tree HEAD firefox) -split '\s+')[2]
          "sha=$sha" >> $env:GITHUB_OUTPUT
          git init -q firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox.git
          foreach ($attempt in 1..3) {
            git -C firefox fetch --depth 1 --no-tags origin $sha
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git -C firefox -c checkout.workers=0 checkout -q --detach FETCH_HEAD

      - name: Restore SpiderMonkey build
        id: js-cache
        uses: actions/cache/restore@v4
        with:
          path: obj/js
          key: firefox-js-windows-${{ steps.firefox.outputs.sha }}-${{ hashFiles('ci/firefox/windows/mozconfig.js') }}

      - name: Restore Skia and NSS
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: obj/firefox-parts
          key: firefox-browser-windows-${{ steps.firefox.outputs.sha }}-${{ hashFiles('ci/firefox/windows/mozconfig.browser', 'ci/firefox/*') }}

      - name: Install MozillaBuild
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $setup = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe" -OutFile $setup
          Start-Process $setup -ArgumentList '/S' -Wait
          if (-not (Test-Path C:\mozilla-build\msys2\usr\bin\bash.exe)) { throw "MozillaBuild was not installed" }

      - name: Build SpiderMonkey on cache miss
        if: steps.js-cache.outputs.cache-hit != 'true'
        run: |
          $env:PATH = "C:\mozilla-build\bin;C:\mozilla-build\python3;C:\mozilla-build\msys2\usr\bin;$env:PATH"
          & C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail -c "bash ci/firefox/build.sh js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save SpiderMonkey build
        if: steps.js-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: obj/js
          key: ${{ steps.js-cache.outputs.cache-primary-key }}

      - name: Build Skia and NSS on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          $env:PATH = "C:\mozilla-build\bin;C:\mozilla-build\python3;C:\mozilla-build\msys2\usr\bin;$env:PATH"
          & C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail -c "bash ci/firefox/build.sh browser"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save Skia and NSS
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: obj/firefox-parts
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Discard unneeded browser intermediates
        run: |
          if (Test-Path obj/browser) {
            python -c "import shutil; shutil.rmtree('obj/browser')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Bootstrap toolchains for the cached SpiderMonkey build
        if: steps.js-cache.outputs.cache-hit == 'true'
        run: |
          $env:PATH = "C:\mozilla-build\bin;C:\mozilla-build\python3;C:\mozilla-build\msys2\usr\bin;$env:PATH"
          & C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail -c "bash ci/firefox/build.sh toolchain"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build js.exe and ruyijs_client.dll
        run: |
          python tools/build.py --donor-obj obj/js --toolchain-bin "$env:MOZBUILD_STATE_PATH\clang\bin" --firefox-gfx-obj obj/firefox-parts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Assemble the runtime archive
        run: |
          python ci/package/runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the wheel
        run: |
          python -m pip install --quiet "setuptools>=77" wheel
          $env:RUYIJS_BUILD_RUNTIME_ARCHIVE = (Get-ChildItem build/ci-runtime/*.zip).FullName
          python -m pip wheel --no-deps --no-build-isolation -w wheelhouse .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem wheelhouse | Format-Table Name, Length

      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE\wheelhouse\*.whl").FullName
          wheel-test\Scripts\python.exe -m pip install --quiet --no-index $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          wheel-test\Scripts\python.exe -c "import ruyijs; print(ruyijs.__version__, ruyijs.get_runtime_path())"
          wheel-test\Scripts\python.exe "$env:GITHUB_WORKSPACE\ci\smoke_test.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wheel-test\Scripts\python.exe "$env:GITHUB_WORKSPACE\ci\network_smoke.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the wheel and runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruyijs-windows
          path: |
            wheelhouse/*.whl
            build/ci-runtime/*.zip
            build/ci-runtime/runtime.json
            artifacts/build-runtime.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Firefox logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-windows-logs
          path: |
            obj/*/config.log
            obj/*/.mozbuild/*.log
          if-no-files-found: ignore
          retention-days: 7
