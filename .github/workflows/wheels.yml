name: Wheels

# Full native builds run on manual dispatch or version tags. Each selected
# platform owns one VM through dependencies, packaging and installed-wheel tests.
run-name: Wheels (${{ inputs.platform || 'all' }}, ${{ github.ref_name }})
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build (one VM per selected platform)
        type: choice
        required: true
        default: linux
        options:
          - linux
          - windows
          - macos
          - windows-macos
          - all

concurrency:
  group: wheels-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'windows-macos' || inputs.platform == 'all'
    uses: ./.github/workflows/build-windows.yml
  macos:
    name: macOS
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'windows-macos' || inputs.platform == 'all'
    uses: ./.github/workflows/build-macos.yml
  linux:
    name: Linux
    if: github.event_name == 'push' || inputs.platform == 'linux' || inputs.platform == 'all'
    uses: ./.github/workflows/build-linux.yml
