name: CI

on:
  push:
    branches: [main]
    paths: &ci-paths
      - '.github/workflows/**'
      - 'ci/**'
      - 'python/**'
      - 'native_tests/**'
      - 'src/**'
      - 'native/**'
      - 'tools/**'
      - 'profiles/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'runtime.json'
      - 'firefox'
  pull_request:
    paths: *ci-paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    name: Lint and Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install --quiet pyflakes PyYAML
      - name: Byte-compile
        run: python -m compileall -q python/ruyijs ci
      - name: pyflakes
        run: python -m pyflakes python/ruyijs ci
      # These classes exercise this checkout without downloading a released
      # runtime or building Firefox. Native/wheel smoke belongs to Build jobs.
      - name: Python and workflow regression tests
        run: |
          python -B -m unittest -v ci.test_workflows \
            native_tests.test_profile_generator.ProfileGeneratorTests \
            native_tests.test_turnstile_api.TurnstileApiTests
