name: Build (macOS)

# One Apple Silicon VM owns the cached Firefox dependencies, native build and
# installed-wheel tests. Direct and reusable dispatches share a concurrency key.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ruyijs-macos:
    name: ruyijs (macOS)
    runs-on: macos-26
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - name: Runner facts
        run: |
          echo "CPUs: $(sysctl -n hw.ncpu)  RAM: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          df -h "$GITHUB_WORKSPACE"
          xcodebuild -version
          xcrun --show-sdk-path

      - uses: actions/checkout@v4

      - name: Fetch Firefox (the submodule commit only)
        id: firefox
        run: |
          sha=$(git ls-tree HEAD firefox | awk '{print $3}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git init -q firefox
          git -C firefox remote add origin https://github.com/mozilla-firefox/firefox.git
          for attempt in 1 2 3; do
            git -C firefox fetch --depth 1 --no-tags origin "$sha" && break
            sleep 30
          done
          git -C firefox -c checkout.workers=0 checkout -q --detach FETCH_HEAD

      - name: Restore SpiderMonkey build
        id: js-cache
        uses: actions/cache/restore@v4
        with:
          path: obj/js
          key: firefox-js-macos-${{ steps.firefox.outputs.sha }}-${{ hashFiles('ci/firefox/macos/mozconfig.js') }}

      - name: Restore Skia and NSS
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: obj/firefox-parts
          key: firefox-browser-macos-${{ steps.firefox.outputs.sha }}-${{ hashFiles('ci/firefox/macos/mozconfig.browser', 'ci/firefox/*') }}

      # mach's virtualenvs require a supported PyO3 Python, including on misses.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SpiderMonkey on cache miss
        if: steps.js-cache.outputs.cache-hit != 'true'
        run: bash ci/firefox/build.sh js

      - name: Save SpiderMonkey build
        if: steps.js-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: obj/js
          key: ${{ steps.js-cache.outputs.cache-primary-key }}

      - name: Build Skia and NSS on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bash ci/firefox/build.sh browser

      - name: Save Skia and NSS
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: obj/firefox-parts
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      - name: Discard unneeded browser intermediates
        run: rm -rf obj/browser

      - name: Bootstrap toolchains for the cached SpiderMonkey build
        if: steps.js-cache.outputs.cache-hit == 'true'
        run: bash ci/firefox/build.sh toolchain

      - name: Necko helper venv
        run: |
          mkdir -p vendor/necko-derived/wheels
          python3.12 -m pip download --quiet -d vendor/necko-derived/wheels \
            requests brotli zstandard h2 cryptography backports.zstd publicsuffixlist
          python3.12 -B tools/bootstrap_macos_helper.py

      - name: Build dist/js and libruyijs_client.dylib
        run: python3.12 -B tools/build.py --donor-obj obj/js --toolchain-bin "$HOME/.mozbuild/clang/bin" --firefox-gfx-obj obj/firefox-parts

      - name: Build libnecko_core.dylib
        run: python3.12 -B tools/build.py --necko-core-only --firefox-gfx-obj obj/firefox-parts

      - name: Build libnecko_quic.dylib
        env:
          RUYIJS_DONOR_OBJ: ${{ github.workspace }}/obj/firefox-parts
        run: python3.12 -B tools/build_necko_quic.py library

      - name: Build the wheel
        run: |
          python3.12 -m pip install --quiet "setuptools>=77" wheel
          python3.12 -m pip wheel --no-deps --no-build-isolation -w wheelhouse .
          ls -la wheelhouse

      - name: Test the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          python3.12 -m venv wheel-test
          wheel-test/bin/python -m pip install --quiet "$GITHUB_WORKSPACE"/wheelhouse/*.whl
          unset PYTHONPATH
          wheel-test/bin/python -c "import ruyijs; print(ruyijs.__version__, ruyijs.get_runtime_path())"
          wheel-test/bin/python "$GITHUB_WORKSPACE/ci/smoke_test.py"
          wheel-test/bin/python "$GITHUB_WORKSPACE/ci/network_smoke.py"

      - name: Upload the wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruyijs-macos
          path: |
            wheelhouse/*.whl
            artifacts/build-runtime.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Disk after build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh obj/* "$HOME/.mozbuild" 2>/dev/null || true

      - name: Upload Firefox logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-macos-logs
          path: obj/*/config.log
          if-no-files-found: ignore
          retention-days: 7
